<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470">
<rect width="920" height="470" fill="#fcfcfb"/>
<text x="30" y="36" font-family="system-ui, 'Segoe UI', sans-serif" font-size="19" font-weight="600" fill="#0b0b0b">What happens to the opportunity screen?</text>
<text x="30" y="58" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" fill="#52514e">One week of GB balancing data, 2026-08-04 to 2026-08-10. 25,326 accepted actions had an apparently better-priced alternative in raw bid-offer data.</text>
<text x="30" y="92" font-family="system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0b0b0b">Naive counterfactual notional — arithmetic on public numbers, not value</text>
<rect x="30" y="104" width="660" height="34" rx="4" fill="#86b6ef"/>
<text x="700" y="126.0" font-family="system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0b0b0b">£607.8m</text>
<text x="30" y="153" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">raw screen: accepted MWh × apparent gap</text>
<rect x="30" y="164" width="63" height="34" rx="4" fill="#2a78d6"/>
<text x="103" y="186.0" font-family="system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0b0b0b">£57.6m</text>
<text x="30" y="213" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">after removing provably non-deliverable alternatives (90.5% vanished)</text>
<text x="30" y="250" font-family="system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0b0b0b">The screen's top 100 apparent opportunities (ranked by gap)</text>
<rect x="30" y="262" width="660" height="34" rx="4" fill="#86b6ef"/>
<text x="700" y="284.0" font-family="system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0b0b0b">100</text>
<text x="30" y="311" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">raw top 100</text>
<rect x="30" y="322" width="3" height="34" rx="4" fill="#2a78d6"/>
<text x="43" y="344.0" font-family="system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0b0b0b">0</text>
<text x="30" y="371" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">whose #1 pick could actually deliver</text>
<rect x="30" y="382" width="3" height="34" rx="4" fill="#2a78d6"/>
<text x="43" y="404.0" font-family="system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0b0b0b">0</text>
<text x="30" y="431" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">still in the top 100 once feasibility is applied</text>
</svg>
