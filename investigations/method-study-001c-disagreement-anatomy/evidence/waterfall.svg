<text x="696" y="169" font-family="system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0b0b0b">64.7%</text>
<text x="330" y="190" font-family="system-ui, 'Segoe UI', sans-serif" font-size="11" fill="#52514e">catches 1,988/2,017 · false alarms 2,226</text>
<text x="318" y="222" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" fill="#52514e" text-anchor="end">− NESO 'Wind offer' exclusions</text>
