<svg xmlns="http://www.w3.org/2000/svg" width="920" height="572" viewBox="0 0 920 572">
<rect width="920" height="572" fill="#fcfcfb"/>
<text x="30" y="36" font-family="system-ui, 'Segoe UI', sans-serif" font-size="19" font-weight="600" fill="#0b0b0b">Agreement with NESO, one layer of operational truth at a time</text>
<text x="30" y="58" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" fill="#52514e">Share of 6,390 unit-day cells where the screen and NESO's stage-5 skip methodology agree. Adopting volumetric exclusions as binary filters over-corrects: the decline is the finding.</text>
<text x="318" y="114" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" fill="#52514e" text-anchor="end">naive price screen (BOD at face value)</text>
