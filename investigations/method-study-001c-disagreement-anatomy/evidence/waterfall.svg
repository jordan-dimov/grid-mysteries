<text x="532" y="115" font-family="system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#0b0b0b">34.9%</text>
<text x="330" y="136" font-family="system-ui, 'Segoe UI', sans-serif" font-size="11" fill="#52514e">catches 1,997/2,017 · false alarms 4,137</text>
<text x="318" y="168" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" fill="#52514e" text-anchor="end">+ physical deliverability (FPN/MEL/MIL)</text>
