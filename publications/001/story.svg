<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1130" viewBox="0 0 920 1130">
<rect width="920" height="1130" fill="#fcfcfb"/>
<text x="48" y="52" font-family="system-ui, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0b0b0b">Anatomy of a phantom opportunity screen</text>
<text x="48" y="78" font-family="system-ui, 'Segoe UI', sans-serif" font-size="14" fill="#52514e">One week of Britain's Balancing Mechanism, 4–10 August 2026, reconstructed from public data — layer by layer.</text>
<text x="48" y="128" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2a78d6" letter-spacing="2">PRICE</text>
<text x="48" y="176" font-family="system-ui, 'Segoe UI', sans-serif" font-size="40" font-weight="700" fill="#0b0b0b">3,856,031</text>
<text x="48" y="200" font-family="system-ui, 'Segoe UI', sans-serif" font-size="14" fill="#52514e">apparent price-order inversions — cases where a better-priced action looks ignored if bid-offer data is taken at face value.</text>
<rect x="48" y="214" width="824" height="26" rx="4" fill="#86b6ef"/>
<text x="48" y="262" font-family="system-ui, 'Segoe UI', sans-serif" font-size="14" fill="#52514e">Apparent counterfactual notional — arithmetic on public numbers, not value: <tspan font-weight="700" fill="#0b0b0b">£607.8m</tspan></text>
<text x="48" y="318" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2a78d6" letter-spacing="2">PHYSICS</text>
<text x="48" y="344" font-family="system-ui, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#0b0b0b">One question: could the “better” alternative actually deliver a single megawatt?</text>
<rect x="48" y="358" width="78" height="26" rx="4" fill="#2a78d6"/>
<text x="136" y="376" font-family="system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0b0b0b">£57.6m remains — 90.5% vanished</text>
<circle cx="53" cy="412" r="3" fill="#2a78d6"/><text x="66" y="417" font-family="system-ui, 'Segoe UI', sans-serif" font-size="14" fill="#0b0b0b">top 1,000 apparent opportunities: 1,000/1,000 led by a physically impossible pick</text>
<circle cx="53" cy="438" r="3" fill="#2a78d6"/><text x="66" y="443" font-family="system-ui, 'Segoe UI', sans-serif" font-size="14" fill="#0b0b0b">overlap between the raw and feasibility-aware top 100: 0</text>
<circle cx="53" cy="464" r="3" fill="#2a78d6"/><text x="66" y="469" font-family="system-ui, 'Segoe UI', sans-serif" font-size="14" fill="#0b0b0b">agreement with NESO's own skip methodology: 35% → 65%, still catching 1,988 of 2,017 skips</text>
<text x="48" y="542" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2a78d6" letter-spacing="2">OPERATIONAL CONTEXT</text>
<text x="48" y="568" font-family="system-ui, 'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#0b0b0b">The 2,226 unit-days where the physics-aware screen still disagreed with NESO…</text>
<text x="48" y="588" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" fill="#52514e">…attributed through the operator's published exclusions. This is an attribution of disagreement, not an accuracy funnel: the exclusions are volumetric, and adopting them as binary filters degrades agreement.</text>
<rect x="48" y="622" width="330" height="40" rx="3" fill="#2a78d6"/>
<text x="54" y="680" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">not in NESO's availability universe</text>
<text x="54" y="696" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">897 · 40.3%</text>
<rect x="380" y="622" width="283" height="40" rx="3" fill="#eb6834"/>
<text x="386" y="680" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">behind constraint</text>
<text x="386" y="696" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">769 · 34.5%</text>
<rect x="665" y="622" width="204" height="40" rx="3" fill="#1baf7a"/>
<text x="671" y="680" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">other published rules</text>
<text x="671" y="696" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">554 · 24.9%</text>
<rect x="871" y="622" width="4" height="40" rx="3" fill="#0b0b0b"/>
<line x1="875" y1="608" x2="875" y2="620" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="875" y="602" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end">6 unmatched</text>
<text x="48" y="712" font-family="system-ui, 'Segoe UI', sans-serif" font-size="15" fill="#0b0b0b"><tspan font-weight="700">99.7%</tspan> of the remaining disagreement has a public operational explanation.</text>
<text x="48" y="776" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#2a78d6" letter-spacing="2">RESOLUTION</text>
<text x="48" y="850" font-family="system-ui, 'Segoe UI', sans-serif" font-size="64" font-weight="700" fill="#0b0b0b">0</text>
<text x="118" y="820" font-family="system-ui, 'Segoe UI', sans-serif" font-size="15" fill="#0b0b0b">unexplained cases left in the week. The last 6 unit-days fell</text>
<text x="118" y="842" font-family="system-ui, 'Segoe UI', sans-serif" font-size="15" fill="#0b0b0b">too: the mistake was on the other side of the comparison — accepted</text>
<text x="118" y="864" font-family="system-ui, 'Segoe UI', sans-serif" font-size="15" fill="#0b0b0b">actions NESO itself removes from its skip stack as constraint management.</text>
<text x="48" y="908" font-family="system-ui, 'Segoe UI', sans-serif" font-size="15" font-style="italic" fill="#0b0b0b">Electricity-market data can be completely accurate and still tell you the wrong story</text>
<text x="48" y="928" font-family="system-ui, 'Segoe UI', sans-serif" font-size="15" font-style="italic" fill="#0b0b0b">if you reconstruct the system at the wrong level of resolution.</text>
<text x="48" y="972" font-family="system-ui, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#2a78d6">Next: a completely untouched week, rules frozen before the data is seen, the selector now physics- and constraint-aware. Now we find out what survives.</text>
<line x1="48" y1="1030" x2="872" y2="1030" stroke="#e5e4e0"/>
<text x="48" y="1056" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">Pre-registered hypotheses · pinned evidence (SHA-256) · governed Morpholog audit record · reproducible CI</text>
<text x="48" y="1076" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">github.com/jordan-dimov/grid-mysteries — every number above is bound to a committed evidence artefact (see PUBLICATION-001.md).</text>
</svg>
