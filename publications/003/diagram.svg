<svg xmlns="http://www.w3.org/2000/svg" width="920" height="724" viewBox="0 0 920 724">
<rect width="920" height="724" fill="#fcfcfb"/>
<text x="48" y="46" font-family="system-ui, 'Segoe UI', sans-serif" font-size="23" font-weight="700" fill="#0b0b0b">What the public record can and cannot show</text>
<text x="48" y="70" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13.5" fill="#52514e">The repetitive part is observable at scale. The re-trading economics are not.</text>
<rect x="48" y="108" width="190" height="96" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
<text x="143.0" y="134" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#2a78d6" text-anchor="middle" letter-spacing="1">OBSERVED</text>
<text x="143.0" y="162" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">scheduled to export</text>
<text x="143.0" y="182" font-family="system-ui, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="middle">final physical notification</text>
<line x1="241.0" y1="156.0" x2="256.0" y2="156.0" stroke="#52514e" stroke-width="1.6"/><path d="M 257.0 156.0 l -6 -4 l 0 8 z" fill="#52514e"/>
<rect x="260" y="108" width="190" height="96" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
<text x="355.0" y="134" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#2a78d6" text-anchor="middle" letter-spacing="1">OBSERVED</text>
<text x="355.0" y="162" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">bid down through zero</text>
<text x="355.0" y="182" font-family="system-ui, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="middle">acceptance + published cashflow</text>
<line x1="453.0" y1="156.0" x2="468.0" y2="156.0" stroke="#52514e" stroke-width="1.6"/><path d="M 469.0 156.0 l -6 -4 l 0 8 z" fill="#52514e"/>
<rect x="472" y="108" width="190" height="96" rx="8" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="2" stroke-dasharray="6 4"/>
<text x="567.0" y="146" font-family="system-ui, 'Segoe UI', sans-serif" font-size="30" font-weight="700" fill="#0b0b0b" text-anchor="middle" letter-spacing="1">?</text>
<text x="567.0" y="162" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">intraday re-sale</text>
<text x="567.0" y="182" font-family="system-ui, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="middle">not publicly observable</text>
<line x1="665.0" y1="156.0" x2="680.0" y2="156.0" stroke="#52514e" stroke-width="1.6"/><path d="M 681.0 156.0 l -6 -4 l 0 8 z" fill="#52514e"/>
<rect x="684" y="108" width="190" height="96" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="2"/>
<text x="779.0" y="134" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#2a78d6" text-anchor="middle" letter-spacing="1">OBSERVED</text>
<text x="779.0" y="162" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle">scheduled, bid down again</text>
<text x="779.0" y="182" font-family="system-ui, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="middle">the cycle re-arms</text>
<text x="48" y="238" font-family="system-ui, 'Segoe UI', sans-serif" font-size="14" fill="#0b0b0b">This shape occurred <tspan font-weight="700">8,259 times</tspan> across GB storage during the fourteen episode dates</text>
<text x="48" y="258" font-family="system-ui, 'Segoe UI', sans-serif" font-size="14" fill="#0b0b0b">(69,869 MWh bid down) — GB-wide concurrence, <tspan font-weight="700">not attributed to the boundary</tspan>.</text>
<text x="48" y="292" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#1baf7a" letter-spacing="2">THE PUBLISHED MONEY, SIDE BY SIDE (EPISODE DATES)</text>
<text x="48" y="323" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b">Storage bids (GB-wide)</text>
<text x="872" y="323" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="end">£-6.74m</text>
<text x="48" y="347" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b">Storage offers (GB-wide)</text>
<text x="872" y="347" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="end">£+9.15m</text>
<text x="48" y="371" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b">Non-storage bids (GB-wide)</text>
<text x="872" y="371" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="end">£-3.52m</text>
<text x="48" y="395" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b">Non-storage offers (GB-wide)</text>
<text x="872" y="395" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="end">£+78.39m</text>
<text x="48" y="419" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b">NESO outturn constraint cost, SSE-SP group</text>
<text x="872" y="419" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="end">£+11.51m</text>
<text x="48" y="442" font-family="system-ui, 'Segoe UI', sans-serif" font-size="11.5" fill="#52514e">Published indicative BM cashflows (BSC sign convention) and NESO's published outturn — presented side by side, never reconciled to each other.</text>
<text x="48" y="480" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" letter-spacing="2">WHY THE COLUMNS CANNOT BE JOINED</text>
<rect x="48.0" y="492" width="400" height="104" rx="8" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="64.0" y="528" font-family="system-ui, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0b0b0b">?</text>
<text x="92.0" y="522" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">Which cashflows belong to the boundary?</text>
<text x="64.0" y="546" font-family="system-ui, 'Segoe UI', sans-serif" font-size="11.5" fill="#52514e">No public unit-to-constraint-group mapping exists — evidenced</text>
<text x="64.0" y="562" font-family="system-ui, 'Segoe UI', sans-serif" font-size="11.5" fill="#52514e">against NESO's own published datasets.</text>
<rect x="472.0" y="492" width="400" height="104" rx="8" fill="#fcfcfb" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="488.0" y="528" font-family="system-ui, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0b0b0b">?</text>
<text x="516.0" y="522" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#0b0b0b">When were schedules revised?</text>
<text x="488.0" y="546" font-family="system-ui, 'Segoe UI', sans-serif" font-size="11.5" fill="#52514e">PN revision history is never published: the revision</text>
<text x="488.0" y="562" font-family="system-ui, 'Segoe UI', sans-serif" font-size="11.5" fill="#52514e">window lies entirely before gate closure — probed, with</text>
<text x="488.0" y="578" font-family="system-ui, 'Segoe UI', sans-serif" font-size="11.5" fill="#52514e">controls.</text>
<text x="48" y="632" font-family="system-ui, 'Segoe UI', sans-serif" font-size="15" font-style="italic" fill="#0b0b0b">The public record can show the repetitive part. It cannot, by itself, prove the re-trading economics.</text>
<line x1="48" y1="672" x2="872" y2="672" stroke="#e5e4e0"/>
<text x="48" y="694" font-family="system-ui, 'Segoe UI', sans-serif" font-size="11.5" fill="#52514e">Evidence: episode-accounting.json, pn-vintage-probe.json, reference-manifest.json · pre-declared, pinned, governed · github.com/jordan-dimov/grid-mysteries</text>
</svg>
