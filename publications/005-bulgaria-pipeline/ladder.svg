<svg xmlns="http://www.w3.org/2000/svg" width="920" height="442" viewBox="0 0 920 442">
<rect width="920" height="442" fill="#fcfcfb"/>
<text x="30" y="36" font-family="system-ui, 'Segoe UI', sans-serif" font-size="19" font-weight="600" fill="#0b0b0b">Bulgaria's data-centre boom: connection interest versus evidence of execution</text>
<text x="30" y="60" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13" fill="#52514e">Four public measures on one MW scale; these are not a single project cohort. Observation date beside each.</text>
<text x="366" y="140" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13.5" fill="#0b0b0b" text-anchor="end">Requested (applications and intentions)</text>
<text x="366" y="154" font-family="system-ui, 'Segoe UI', sans-serif" font-size="10.5" fill="#52514e" text-anchor="end">as of 2026-08-03</text>
<path d="M378.0,128.0 H758.0 A4,4 0 0 1 762.0,132.0 V146.0 A4,4 0 0 1 758.0,150.0 H378.0 Z" fill="#2a78d6"/>
<text x="770.0" y="144" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#0b0b0b">9,330 MW</text>
<text x="366" y="186" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13.5" fill="#0b0b0b" text-anchor="end">Holding an ESO connection opinion</text>
<text x="366" y="200" font-family="system-ui, 'Segoe UI', sans-serif" font-size="10.5" fill="#52514e" text-anchor="end">as of 2026-08-03</text>
<path d="M378.0,174.0 H530.2 A4,4 0 0 1 534.2,178.0 V192.0 A4,4 0 0 1 530.2,196.0 H378.0 Z" fill="#2a78d6"/>
<text x="542.2" y="190" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#0b0b0b">3,795 MW</text>
<text x="366" y="232" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13.5" fill="#0b0b0b" text-anchor="end">Preliminary contracts signed with data-centre applicants</text>
<text x="366" y="246" font-family="system-ui, 'Segoe UI', sans-serif" font-size="10.5" fill="#52514e" text-anchor="end">as of 2026-05-26</text>

<text x="388.0" y="236" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#0b0b0b">0 MW</text>
<text x="366" y="278" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13.5" fill="#0b0b0b" text-anchor="end">Data-centre capacity installed nationally</text>
<text x="366" y="292" font-family="system-ui, 'Segoe UI', sans-serif" font-size="10.5" fill="#52514e" text-anchor="end">as of 2026-08</text>
<path d="M378.0,266.0 H379.0 A1.0,1.0 0 0 1 380.0,267.0 V287.0 A1.0,1.0 0 0 1 379.0,288.0 H378.0 Z" fill="#eb6834"/>
<text x="388.0" y="282" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#0b0b0b">≈30 MW</text>
<line x1="704.0" y1="118" x2="704.0" y2="312" stroke="#52514e" stroke-width="1"/>
<text x="704.0" y="100" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12" fill="#52514e" text-anchor="middle">Forecast national peak demand, 2035: 7,920 MW</text>
<text x="704.0" y="114" font-family="system-ui, 'Segoe UI', sans-serif" font-size="10.5" fill="#52514e" text-anchor="middle">scale reference only — not available grid headroom</text>
<line x1="378" y1="122" x2="378" y2="312" stroke="#e5e4e0" stroke-width="1"/>
<text x="30" y="342" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12.5" fill="#0b0b0b">“obtaining a positive opinion increases the value of the project and allows it to be sold to a strategic investor”</text>
<text x="30" y="360" font-family="system-ui, 'Segoe UI', sans-serif" font-size="12" fill="#52514e">— Kiril Georgiev, CEO of ESO EAD, Capital.bg, 19 August 2026</text>
<text x="30" y="402" font-family="system-ui, 'Segoe UI', sans-serif" font-size="11" fill="#52514e">Sources per bar in evidence.json: economic.bg 2026-08-12 (ESO figures); Mediapool 2026-05-26;</text>
<text x="30" y="418" font-family="system-ui, 'Segoe UI', sans-serif" font-size="11" fill="#52514e">Capital.bg 2026-08-19; ESO draft development plan 2026–2035. Forward Mysteries F003 / F004.</text>
</svg>
