[project]
name = "grid-mysteries"
version = "0.1.0"
description = "Reproducible investigations of surprising events on Britain's electricity system."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Jordan Dimov" }]
dependencies = [
    "httpx>=0.28",
    "polars>=1.30",
]

[project.scripts]
grid-mysteries = "grid_mysteries.cli:app"

[dependency-groups]
dev = [
    "hypothesis>=6.165.9",
    "mypy>=2.3.1",
    "pytest>=8.4",
    "ruff>=0.12",
]
registers = [
    "openpyxl>=3.1",
    "xlrd>=2.0",
]

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = ["grid_mysteries", "morpholog_client"]

[tool.ruff]
target-version = "py314"
line-length = 100
# Generated by `morpholog generate python-client`; must stay byte-identical
# to the generator's output (scripts/check diffs it), so never reformatted.
# Certificate bundles are generated evidence; their verify.py is the template's
# output at issue time and is not restyled afterwards.
extend-exclude = ["src/morpholog_client", "investigations/*/certificates"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src", "tests"]
# Deliberately loose to start: verify the annotations we already write,
# without demanding annotations everywhere. Strictness ratchets up later.
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
# The generated client is drift-checked against its generator, not typechecked.
exclude = ["src/morpholog_client"]

[[tool.mypy.overrides]]
module = "morpholog_client.*"
follow_imports = "skip"
ignore_errors = true
