# Render services. The static site hosts The Balancing Bill (013) and GB
# Connection Slippage (014): no build step, pages are generated by the runners
# and committed. The cron job is the vintage capture of ops/VINTAGE-CAPTURE.md.
# Deploys are manual (autoDeploy off): publishing is the sponsor's act, like
# every other release in this project.
services:
  - type: web
    name: balancing-bill
    runtime: static
    buildCommand: ""
    staticPublishPath: site
    autoDeploy: false
    domains:
      - balancingbill.a115.co.uk
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
  - type: cron
    name: vintage-capture
    runtime: docker
    region: frankfurt
    plan: starter
    schedule: "30 6 * * *"
    dockerfilePath: ./Dockerfile
    dockerCommand: uv run --no-sync --group capture --group registers grid-mysteries capture run
    autoDeploy: false
    envVars:
      - key: VINTAGE_STORE
        value: s3://a115-vintages
      - key: AWS_DEFAULT_REGION
        value: eu-west-2
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: HEALTHCHECK_URL_CAPTURE
        sync: false
