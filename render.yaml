# Render static hosting for The Balancing Bill (investigation 013's public
# page). No build step: `site/index.html` is generated by the 013 runner from
# `evidence/tracker.json` and committed. Deploys are manual (autoDeploy off):
# publishing is the sponsor's act, like every other release in this project.
services:
  - type: web
    name: balancing-bill
    runtime: static
    buildCommand: ""
    staticPublishPath: site
    autoDeploy: false
    domains:
      - balancingbill.a115.co.uk
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
