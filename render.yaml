# Render services. The static site is research.a115.co.uk: a research index
# at the root and one page per standing instrument under its own path (The
# Balancing Bill at /balancing-bill/, GB Connection Slippage at
# /connection-slippage/, the overdue queue at /overdue-queue/, where the
# dates move at /slippage-by-technology-and-area/). No build step: pages are
# generated by the runners and committed. The earlier domain
# balancingbill.a115.co.uk was never created in DNS and was removed from the
# service on 2026-10-01; a blueprint sync must not re-add it. No redirect is
# declared for the Balancing Bill's move from the root: every link ever
# published to it pointed at the root, which now lists it first, and a
# redirect from the root would hide the index. The cron job is the vintage
# capture of ops/VINTAGE-CAPTURE.md.
# Deploys are manual (autoDeploy off): publishing is the sponsor's act, like
# every other release in this project. Secrets (the capture writer's AWS key
# pair, the two healthchecks URLs, SEAL_013) live in the dashboard-managed
# environment group `vintage-secrets`, linked to both cron jobs and never
# declared here, so no blueprint sync can touch them.
services:
  - type: web
    name: balancing-bill
    runtime: static
    buildCommand: ""
    staticPublishPath: site
    autoDeploy: false
    domains:
      - research.a115.co.uk
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
  - type: cron
    name: vintage-capture
    runtime: docker
    region: frankfurt
    plan: starter
    schedule: "30 6 * * *"
    dockerfilePath: ./Dockerfile
    dockerCommand: uv run --no-sync --group capture --group registers grid-mysteries capture run
    autoDeploy: false
    envVars:
      - key: VINTAGE_STORE
        value: s3://a115-vintages
      - key: AWS_DEFAULT_REGION
        value: eu-west-2
      - fromGroup: vintage-secrets
  - type: cron
    name: tracker-013
    runtime: docker
    region: frankfurt
    plan: starter
    schedule: "0 9 * * *"
    dockerfilePath: ./Dockerfile
    dockerCommand: scripts/run-013-render
    autoDeploy: false
    envVars:
      - key: VINTAGE_STORE
        value: s3://a115-vintages
      - key: AWS_DEFAULT_REGION
        value: eu-west-2
      - fromGroup: vintage-secrets
